<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - BloodLink</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>

    <div class="logo">🩸 BloodLink</div>

    <ul>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/search">Find Donor</a></li>
        <li><a href="/availability">Availability</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>

</nav>

<div class="profile-container">

    <div class="profile-card">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
             alt="Profile">

        <h1>{{ user[1] }}</h1>

        <p>
            <strong>Email:</strong>
            {{ user[2] }}
        </p>

        <p>
            <strong>Phone:</strong>
            {{ user[3] }}
        </p>

        <p>
            <strong>College ID:</strong>
            {{ user[4] }}
        </p>

        <p>
            <strong>Location:</strong>
            {{ user[5] }}
        </p>

        <p>
            <strong>Blood Group:</strong>
            {{ user[6] }}
        </p>

        {% if user[8] == 'Available' %}

            <p class="available">
                🟢 {{ user[8] }}
            </p>

        {% else %}

            <p class="unavailable">
                🔴 {{ user[8] }}
            </p>

        {% endif %}

        <a href="/edit-profile">

            <button>
                Edit Profile
            </button>

        </a>

    </div>

</div>

</body>
</html>
