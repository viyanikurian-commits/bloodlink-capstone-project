<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - BloodLink</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<div class="register-container">

    <form class="register-form"
          method="POST"
          action="/admin-login">

        <h1>🛡️ Admin Login</h1>

        <p style="
            text-align:center;
            margin-bottom:25px;
            color:gray;
        ">

            Login to access BloodLink administration panel

        </p>

        <input type="email"
               name="email"
               placeholder="Admin Email"
               required>

        <input type="password"
               name="password"
               placeholder="Admin Password"
               required>

        <button type="submit">

            Login as Admin

        </button>

        <div style="
            text-align:center;
            margin-top:20px;
        ">

            <a href="/"
               style="
                    color:#b30000;
                    text-decoration:none;
                    font-weight:600;
               ">

                ← Back to Home

            </a>

        </div>

    </form>

</div>

</body>
</html>
