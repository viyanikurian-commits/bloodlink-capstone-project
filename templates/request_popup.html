<!DOCTYPE html>
<html lang="en">
<head>

    <title>Emergency Request - BloodLink</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="popup-overlay">

        <div class="popup-box">

            <h1>🚨 Emergency Blood Request</h1>

            <p>

    </div>
