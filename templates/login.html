<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - BloodLink</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="register-container">

    <form class="register-form"
          method="POST"
          action="/login">

        <h1>🩸 Welcome Back</h1>

        <p style="text-align:center;
                  margin-bottom:25px;
                  color:gray;">
            Login to continue saving lives
        </p>

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

        <div style="text-align:center;
                    margin-top:20px;">

            <a href="/register"
               style="color:#b30000;
                      text-decoration:none;
                      font-weight:600;">

                Create New Account

            </a>

        </div>

    </form>

</div>

</body>
</html>
